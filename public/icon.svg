<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background with squircle/rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="120" fill="url(#glowGrad)"/>
  
  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Central Rocket & Boost Arrow -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Boost Aura -->
    <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.12"/>
    
    <!-- Rocket Body -->
    <path d="M256 80 C290 120 340 180 340 270 C340 330 300 370 256 380 C212 370 172 330 172 270 C172 180 222 120 256 80 Z" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.25))"/>
    
    <!-- Rocket Window -->
    <circle cx="256" cy="210" r="34" fill="#0f172a"/>
    <circle cx="256" cy="210" r="26" fill="#f97316"/>
    <circle cx="248" cy="202" r="8" fill="#ffffff" opacity="0.8"/>
    
    <!-- Wings / Fins -->
    <path d="M172 270 L110 320 L150 360 L180 340 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M340 270 L402 320 L362 360 L332 340 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Thrust Flame -->
    <path d="M230 380 L256 440 L282 380 Z" fill="#fef08a"/>
    <path d="M242 380 L256 420 L270 380 Z" fill="#ffffff"/>
    
    <!-- Star / Lightning Highlights -->
    <path d="M256 120 L262 135 L278 138 L266 148 L270 164 L256 155 L242 164 L246 148 L234 138 L250 135 Z" fill="#fef08a"/>
  </g>
</svg>
