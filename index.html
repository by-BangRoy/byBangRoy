    <script>
      // Suppress benign WebSocket/HMR reconnection errors in sandbox proxy environment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
